# Настройки SearXNG для Антигравити Копирайтера
# Движки: только работающие с российского VPS IP (западные капчуются).
use_default_settings:
  engines:
    keep_only:
      - yandex
      - wikipedia

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "antigravity_searxng_secret_key_2026"

search:
  formats:
    - html
    - json

engines:
  - name: yandex
    disabled: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
